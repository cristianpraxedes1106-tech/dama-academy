<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DAMA — Aprenda. Jogue. Domine. Plataforma completa de aprendizado de Damas Brasileiras.">
  <title>DAMA — Aprenda. Jogue. Domine.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Splash / Onboarding -->
    <div id="onboarding" class="screen onboarding hidden">
      <div class="onboarding-content">
        <div id="onboard-mascot" class="mascot-container large"></div>
        <h1 id="onboard-title">Oi! Eu sou a Pantera.</h1>
        <p id="onboard-text">Vou te ensinar a jogar Damas Brasileiras de verdade.</p>
        <button id="onboard-btn" class="btn btn-primary btn-lg">COMEÇAR</button>
      </div>
    </div>

    <!-- Main App Shell -->
    <div id="main-app" class="main-app hidden">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="logo" id="logo-btn">
            <svg class="logo-icon" viewBox="0 0 40 40" width="36" height="36"><circle cx="20" cy="20" r="18" fill="var(--accent)"/><path d="M12 22c0-5 3-9 8-9s8 4 8 9" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="16" r="2" fill="#fff"/><circle cx="25" cy="16" r="2" fill="#fff"/></svg>
            <span class="logo-text">DAMA</span>
          </div>
        </div>
        <div class="topbar-center">
          <div class="xp-display" id="xp-display" title="Experiência">
            <div class="xp-bar-wrap">
              <div class="xp-bar" id="xp-bar"></div>
            </div>
            <span class="xp-text" id="xp-text">0 XP</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="streak-badge" id="streak-badge" title="Sequência diária">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2C9 7 4 9 4 14a8 8 0 0016 0c0-5-5-7-8-12z"/></svg>
            <span id="streak-count">0</span>
          </div>
          <button class="icon-btn" id="theme-toggle" aria-label="Alternar tema">
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5" fill="currentColor"/><path stroke="currentColor" stroke-width="2" d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            <svg class="icon-moon hidden" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
          </button>
          <button class="icon-btn" id="sound-toggle" aria-label="Som">
            <svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
            <svg class="icon-sound-off hidden" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16.5 12c0-1.8-1-3.3-2.5-4v2.2l2.5 2.5V12zm2.5 0c0 .9-.2 1.8-.5 2.6l1.5 1.5c.6-1.3 1-2.7 1-4.1 0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.5 5 6.7zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3 1.3-1.3L4.3 3zM12 4L9.9 6.1 12 8.2V4z"/></svg>
          </button>
        </div>
      </header>

      <div class="app-body">
        <!-- Sidebar Desktop -->
        <nav class="sidebar" id="sidebar" aria-label="Navegação principal">
          <button class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Início</span>
          </button>
          <button class="nav-item" data-view="learn">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3L1 9l4 2.2V17h2v-4.5L12 15l11-6-11-6zm0 10.5L5.5 10 12 6.5 18.5 10 12 13.5z"/></svg>
            <span>Aprender</span>
          </button>
          <button class="nav-item" data-view="train">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8l-9 9z"/></svg>
            <span>Treino</span>
          </button>
          <button class="nav-item" data-view="play">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.4-1.4 3.6 3.6 7.6-7.6L21 8l-9 9z"/></svg>
            <span>Jogar</span>
          </button>
          <button class="nav-item" data-view="academy">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3L1 9l11 6 9-4.9V17h2V9L12 3zm0 11.5L5.5 10 12 6.5 18.5 10 12 14.5z"/></svg>
            <span>Academia</span>
          </button>
          <button class="nav-item" data-view="openings">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
            <span>Aberturas</span>
          </button>
          <button class="nav-item" data-view="achievements">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2l2.4 7.4H22l-6 4.6 2.3 7-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"/></svg>
            <span>Conquistas</span>
          </button>
          <button class="nav-item" data-view="profile">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            <span>Perfil</span>
          </button>
          <button class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.1 12.9a7.5 7.5 0 000-1.8l2.1-1.6a.5.5 0 00.1-.6l-2-3.5a.5.5 0 00-.6-.2l-2.5 1a7.3 7.3 0 00-1.5-.9l-.4-2.6a.5.5 0 00-.5-.4h-4a.5.5 0 00-.5.4l-.4 2.6c-.5.2-1 .5-1.5.9l-2.5-1a.5.5 0 00-.6.2l-2 3.5a.5.5 0 00.1.6l2.1 1.6a7.5 7.5 0 000 1.8l-2.1 1.6a.5.5 0 00-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1 .7 1.5.9l.4 2.6c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.4-2.6c.5-.2 1-.5 1.5-.9l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 00-.1-.6l-2.1-1.6zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg>
            <span>Config</span>
          </button>
        </nav>

        <!-- Main Content -->
        <main class="content" id="content">
          <!-- Views injected by JS -->
        </main>
      </div>

      <!-- Mobile Bottom Nav -->
      <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação móvel">
        <button class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Início</span>
        </button>
        <button class="nav-item" data-view="learn">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3L1 9l4 2.2V17h2v-4.5L12 15l11-6-11-6z"/></svg>
          <span>Aprender</span>
        </button>
        <button class="nav-item" data-view="play">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Jogar</span>
        </button>
        <button class="nav-item" data-view="train">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/></svg>
          <span>Treino</span>
        </button>
        <button class="nav-item" data-view="profile">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
          <span>Perfil</span>
        </button>
      </nav>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-root" class="modal-root hidden"></div>

    <!-- Floating XP particles -->
    <div id="fx-layer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
